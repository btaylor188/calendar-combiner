app-id: io.github.btaylor188.CalendarCombiner
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: calendar-combiner
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=ELECTRON_TRASH=gio
modules:
  - name: calendar-combiner
    buildsystem: simple
    build-commands:
      - cp -a linux-unpacked /app/main
      - install -Dm755 calendar-combiner.sh /app/bin/calendar-combiner
      - install -Dm644 io.github.btaylor188.CalendarCombiner.svg /app/share/icons/hicolor/scalable/apps/io.github.btaylor188.CalendarCombiner.svg
      - install -Dm644 io.github.btaylor188.CalendarCombiner.desktop /app/share/applications/io.github.btaylor188.CalendarCombiner.desktop
    sources:
      # Built first with: npm run dist
      - type: dir
        path: ../dist/linux-unpacked
        dest: linux-unpacked
      - type: file
        path: calendar-combiner.sh
      - type: file
        path: io.github.btaylor188.CalendarCombiner.svg
      - type: file
        path: io.github.btaylor188.CalendarCombiner.desktop
